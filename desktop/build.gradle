/*
 Usage:
 ./gradlew build - builds code and creates a single jar in build/libs/frostwire.jar
 ./gradlew clean - cleans the build.
 ./gradlew tasks - shows available tasks.
 ./gradlew run - runs the app

 Make sure ${ANT_HOME} is properly set for these tasks to work
 ./gradlew gettextExtract - extract all the strings from the sourcecode into frostwire.pot
 ./gradlew gettextBundle  - create messages.jar with the extracted strings.
*/
plugins {
    id 'java'
    id 'application'
    id 'com.diffplug.spotless' version '7.0.4'
}

group = 'com.frostwire'
// Single source of truth for the app version: FrostWireUtils.FROSTWIRE_VERSION.
version = (file('src/main/java/com/limegroup/gnutella/util/FrostWireUtils.java').text =~
        /FROSTWIRE_VERSION\s*=\s*"([^"]+)"/)[0][1]

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java', 'src/simulation/java/**/*.java', '../common/src/main/java/**/*.java', '../common/src/test/java/**/*.java', '../common/fuzz/src/test/java/**/*.java'
        ratchetFrom 'origin/master'
        googleJavaFormat('1.36.1')
        toggleOffOn()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.register('lint') {
    group = 'verification'
    description = 'Runs Spotless format check + javac warnings (lint).'
    dependsOn 'spotlessCheck', 'compileJava', 'compileSimulationJava', 'compileTestJava'
    doLast {
        println 'Lint check complete. Fix with: ./gradlew spotlessApply'
    }
}

import org.gradle.internal.os.OperatingSystem

java {
    sourceCompatibility = JavaVersion.VERSION_19
    targetCompatibility = JavaVersion.VERSION_19
}

compileJava {
    options.encoding = '8859_1'
    options.fork = true
    options.compilerArgs += ['-Xlint:deprecation']
    options.compilerArgs += ['-Xlint:unchecked']
}

application {
    mainClass = 'com.limegroup.gnutella.gui.Main'

    applicationDefaultJvmArgs = ['-Djava.library.path=lib/native',
                                 '--add-opens=java.desktop/java.awt=ALL-UNNAMED',
                                 '--add-opens=java.desktop/javax.swing=ALL-UNNAMED',
                                 '--enable-native-access=ALL-UNNAMED',
                                 '-Dsun.java2d.fontlayout=0',
				 '-XX:+PreserveFramePointer',
				 '-XX:ErrorFile=./hs_err_pid%p.log',
				 '-XX:+CreateCoredumpOnCrash',
                                 '-Xms64m',
                                 '-Xmx512m',
                                 // Keep stacks on exceptions the JIT would otherwise throw preallocated and stackless.
                                 '-XX:-OmitStackTraceInFastThrow',
                                 //'-Xss2m', 2MB stack (debugging silent crashes: prolong crashes due to native stack overflows, attach gdb, etc.)
                                 //'-Xss768k', // 768k stack (development)
                                 '-Xss256k', // 256k stack (production)
                                 '-Dfw.running.from.distribution=true',
				 //'-XX:NativeMemoryTracking=detail',
    ]

    // Remote management and JDWP are deliberately opt-in. Release distributions must not
    // expose unauthenticated listeners, while developers can retain the existing workflow with
    // ./gradlew run -Pdebug.
    if (project.hasProperty('debug')) {
        applicationDefaultJvmArgs += [
                '-Dcom.sun.management.jmxremote.port=9595',
                '-Dcom.sun.management.jmxremote.ssl=false',
                '-Dcom.sun.management.jmxremote.authenticate=false',
                '-Djava.rmi.server.hostname=127.0.0.1',
                '-agentlib:jdwp=transport=dt_socket,address=9696,server=y,suspend=n',
        ]
    }

    def flight_recorder = false

    if (flight_recorder) {
        applicationDefaultJvmArgs.add('-XX:StartFlightRecording=name=FW-Startup,' + 'settings=profile,' + // higher-detail preset
                'delay=1s,' + 'disk=true,' + 'dumponexit=true,' + 'maxage=10m,' +                       // keep last 10 minutes
                'maxsize=256m,' +                     // cap file size
                'filename=build/frostwire-startup.jfr')
        // To open the .jfr file with all the recorded data you need JDK Mission Control
        // $ brew install --cask jdk-mission-control
        // $ open -a "JDK Mission Control" build/frostwire-startup.jfr
    }

    if (OperatingSystem.current().isMacOsX()) {
        applicationDefaultJvmArgs += ['--add-exports=java.desktop/com.apple.laf=ALL-UNNAMED', '-Dsun.java2d.metal=true']
    } else if (OperatingSystem.current().isLinux()) {
        // XRender is the fastest stable pipeline on BOTH X.org and XWayland.
        // Measured on this setup (ARM64 VM, virtio/virgl GPU, JDK 26): forcing
        // sun.java2d.xrender=false sends every on-screen image blit through the
        // legacy X11 core path and makes it ~1000x slower (16x16 icon: ~3us with
        // XRender vs ~6.3ms without), which is what freezes the EDT. OpenGL stays
        // off: on virtualized/ARM64 GPUs it can wedge the entire display session.
        applicationDefaultJvmArgs += [
            '-Dsun.java2d.xrender=true',
            '-Dsun.java2d.opengl=false',
        ]
    }
}

tasks.named('run') {
    // Distributed search spawns the icebridge.jar daemon; without it the app
    // silently disables IceBridge, so 'run' must build the jar like 'test' does.
    dependsOn icebridgeJar
    systemProperty 'fw.running.from.distribution', 'false'
    jvmArgs '-Ddebug=1'
    jvmArgs '-Dfw.debug.assertNoEdtIO=true'
    jvmArgs '-XX:-OmitStackTraceInFastThrow'
    // NB: 'run' does not inherit applicationDefaultJvmArgs, mirror the needed flags here.
    jvmArgs '-Djava.library.path=lib/native'
    jvmArgs '--add-opens=java.desktop/java.awt=ALL-UNNAMED'
    jvmArgs '--add-opens=java.desktop/javax.swing=ALL-UNNAMED'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    if (OperatingSystem.current().isMacOsX()) {
        jvmArgs '--add-exports=java.desktop/com.apple.laf=ALL-UNNAMED', '-Dsun.java2d.metal=true'
    } else if (OperatingSystem.current().isLinux()) {
        // Mirror the application{} Linux pipeline flags: XRender is fast on
        // XWayland too, and OpenGL stays off (can wedge virtualized/ARM64
        // sessions). See the application{} Linux block for the measurements.
        jvmArgs '-Dsun.java2d.xrender=true'
        jvmArgs '-Dsun.java2d.opengl=false'
        // Mutter (GNOME Wayland + XWayland) is a non-reparenting WM; without this
        // Java windows can appear blank or unmanaged.
        environment '_JAVA_AWT_WM_NONREPARENTING', '1'
    } else if (OperatingSystem.current().isWindows()) {
        // Java2D pipeline A/B testing (GitHub #1306): ./gradlew run -Pjava2d=d3d|opengl|software
        // d3d is the JDK default and what FrostWire.exe uses from 7.1.2 on.
        def pipeline = project.findProperty('java2d') ?: 'd3d'
        switch (pipeline) {
            case 'd3d':
                jvmArgs '-Dsun.java2d.d3d=true', '-Dsun.java2d.opengl=false'
                break
            case 'opengl': // what FrostWire.exe forced up to 7.1.1
                jvmArgs '-Dsun.java2d.opengl=true'
                break
            case 'software':
                jvmArgs '-Dsun.java2d.d3d=false', '-Dsun.java2d.opengl=false', '-Dsun.java2d.noddraw=true'
                break
            default:
                throw new GradleException("Unknown -Pjava2d=${pipeline}, expected d3d, opengl or software")
        }
        logger.lifecycle("Java2D pipeline: ${pipeline}")
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://dl.frostwire.com/maven' }
}

dependencies {
    // @Nullable cross-os annotation
    implementation 'org.jetbrains:annotations:26.1.0'

    implementation 'com.google.re2j:re2j:1.8'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.googlecode.gettext-commons:gettext-commons:0.9.8'
    implementation 'org.xerial:sqlite-jdbc:3.51.3.0'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.83'

    // Netty for IceBridge relay daemon (shared by desktop control path and headless server fat jar)
    implementation 'io.netty:netty-all:4.2.18.Final'

    // Also used by icebridgeCloudNatives / icebridgeJar multi-arch packaging below.
    ext.jlibtorrent_version = '2.0.12.9'
    def jlibtorrent_version = ext.jlibtorrent_version

    def os = OperatingSystem.current()
    def arch = System.getProperty('os.arch').toLowerCase()
    def is_arm64 = arch == "aarch64" || arch == "arm64"

    def use_maven_jlibtorrent = true

    if (use_maven_jlibtorrent) {
        // jlibtorrent java wrappers
        implementation "com.frostwire:jlibtorrent:${jlibtorrent_version}"

        // jlibtorrent native libraries
        // if we are on windows, we need to use the windows native libraries
        if (os.isWindows()) {
            implementation "com.frostwire:jlibtorrent-windows:${jlibtorrent_version}"
        } else if (os.isLinux()) {
            if (is_arm64) {
                implementation "com.frostwire:jlibtorrent-linux-arm64:${jlibtorrent_version}"
            } else {
                implementation "com.frostwire:jlibtorrent-linux-x86_64:${jlibtorrent_version}"
            }
        } else if (os.isMacOsX()) {
            // if it's arm mac
            if (is_arm64) {
                implementation "com.frostwire:jlibtorrent-macosx-arm64:${jlibtorrent_version}"
            }
            // intel
            else {
                implementation "com.frostwire:jlibtorrent-macosx-x86_64:${jlibtorrent_version}"
            }
        }
    } else {
        // assume use has frostwire-jlibtorrent project checked out (dev mode) at the same level as the frostwire project
        // we are currently at frostwire/desktop
        def jlibtorrent_built_jars_path = '../../frostwire-jlibtorrent/build/libs'
        System.out.println("Using jlibtorrent jars from development environment at ${jlibtorrent_built_jars_path}")

        def main_jar = files("${jlibtorrent_built_jars_path}/jlibtorrent-${jlibtorrent_version}.jar")
        // print everything in the main_jar file collection
        // print the absolute path of the main jar
        main_jar.each { file ->
            System.out.println("Using jlibtorrent jar: ${file.name}")
            System.out.println("Absolute path: ${file.absolutePath}")
        }

        implementation files("${jlibtorrent_built_jars_path}/jlibtorrent-${jlibtorrent_version}.jar")

        if (os.isWindows()) {
            implementation files("${jlibtorrent_built_jars_path}/jlibtorrent-windows-${jlibtorrent_version}.jar")
        } else if (os.isLinux()) {
            if (is_arm64) {
                implementation files("${jlibtorrent_built_jars_path}/jlibtorrent-linux-arm64-${jlibtorrent_version}.jar")
            } else {
                implementation files("${jlibtorrent_built_jars_path}/jlibtorrent-linux-x86_64-${jlibtorrent_version}.jar")
            }
        } else if (os.isMacOsX()) {
            // if it's arm mac
            if (is_arm64) {
                implementation files("${jlibtorrent_built_jars_path}/jlibtorrent-macosx-arm64-${jlibtorrent_version}.jar")
            }
            // intel
            else {
                implementation files("${jlibtorrent_built_jars_path}/jlibtorrent-macosx-x86_64-${jlibtorrent_version}.jar")
            }
        }
    }

    implementation fileTree(dir: 'lib/jars', include: ['*.jar'], exclude: ['frostwire.jar'])
    // FlatLaf for dark theme support
    implementation 'com.formdev:flatlaf:3.7.1'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main {
        java {
            srcDir '../common/src/main/java'
            srcDir 'src/main/java'
        }

        resources {
            srcDir 'resources'
            srcDir '../common/src/main/resources'
            include '**/*.properties'
            include '**/*.png'
            include '**/*.gif'
            include '**/*.jpg'
            include '**/*.html'
            include '**/*.js'
            include '**/*.sh'
            include '**/*.dat'
            include '**/*.icc'
            include '**/*.txt'
            exclude '**/*.DS_Store'
        }
    }

    test {
        java {
            srcDir '../common/src/test/java'
            srcDir 'src/test/java'
        }

        resources {
            srcDir '../common/src/test/resources'
            srcDir 'src/test/resources'
        }
    }

    simulation {
        java.srcDir 'src/simulation/java'
        resources.srcDir 'src/simulation/resources'
    }
}

configurations {
    simulationImplementation.extendsFrom implementation
    simulationRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    simulationImplementation sourceSets.main.output
    testImplementation sourceSets.simulation.output
}

// ZIP paths are case-sensitive, but Apple's archive extraction is not. Netty's
// META-INF/license/ directory collides with dependency META-INF/LICENSE files.
// Preserve the root license at a non-conflicting path in every packaged JAR.
tasks.withType(Jar).configureEach {
    def rootLicensePath = 'META-INF/licenses/LICENSE'
    inputs.property('packagedRootLicensePath', rootLicensePath)
    eachFile { entry ->
        if (entry.path == 'META-INF/LICENSE') {
            entry.path = rootLicensePath
        }
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    archiveFileName = 'frostwire.jar'

    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.MF', 'META-INF/*.md')

    // The headless relay daemon lives in icebridge.jar (see icebridgeJar below),
    // which the macOS/Windows installers ship beside frostwire.jar and launch via
    // `java -jar`. Keep daemon-only IceBridge classes out of frostwire.jar so the
    // two artifacts don't duplicate them: frostwire.jar retains only the
    // in-process client surface (client/*, host cache, protocol constants/DTOs,
    // and metrics constructed at desktop startup and used by transport/search).
    // When adding new daemon-only classes under these packages, extend this list.
    def icebridge = 'com/frostwire/search/relay/icebridge/'
    exclude([
        'IceBridgeAuth*',
        'IceBridgeDhtSession*',
        'IceBridgeException*',
        'IceBridgeServer*',
        'IceBridgeTokens*',
        'RelayMesh*',
        'control/ControlHandler*',
        'control/ControlServer*',
        'control/InboundMessageQueue*',
        'peer/**',
        'udp/**',
    ].collect { icebridge + it })

    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }

    manifest {
        // The bundled SWIG jlibtorrent binding actually calls JNI. Grant the JVM's required
        // native-access permission when launched with java -jar (JEP 472), not a warning override.
        attributes 'Main-Class': 'com.limegroup.gnutella.gui.Main',
                'Enable-Native-Access': 'ALL-UNNAMED'
    }
}

// Extra jlibtorrent natives always packed into icebridge.jar so a Mac-built
// fat JAR still runs DHT/Ed25519 on Linux EC2 (and vice versa). Paths inside
// the jars do not collide (lib/arm64/*.dylib vs lib/x86_64/*.so).
configurations {
    icebridgeCloudNatives
}
dependencies {
    icebridgeCloudNatives "com.frostwire:jlibtorrent-linux-x86_64:${ext.jlibtorrent_version}"
    icebridgeCloudNatives "com.frostwire:jlibtorrent-linux-arm64:${ext.jlibtorrent_version}"
    icebridgeCloudNatives "com.frostwire:jlibtorrent-macosx-arm64:${ext.jlibtorrent_version}"
    icebridgeCloudNatives "com.frostwire:jlibtorrent-macosx-x86_64:${ext.jlibtorrent_version}"
}

// Fat JAR for the headless IceBridge relay servent.
// Reuses common/ sources but packages only the classes Netty/JVM need.
tasks.register('icebridgeJar', Jar) {
    group = 'build'
    description = 'Builds the standalone IceBridge relay servent fat JAR (multi-arch jlibtorrent natives for EC2).'

    archiveFileName = 'icebridge.jar'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.MF', 'META-INF/*.md')
    exclude('META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties')
    exclude('com/limegroup/gnutella/gui/**')
    exclude('com/frostwire/gui/**')
    exclude('com/frostwire/desktop/**')

    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    // Host OS only pulls one platform native via runtimeClasspath; add cloud targets.
    from { configurations.icebridgeCloudNatives.collect { it.isDirectory() ? it : zipTree(it) } }

    manifest {
        attributes 'Main-Class': 'com.frostwire.search.relay.icebridge.IceBridgeServer',
                'Enable-Native-Access': 'ALL-UNNAMED'
    }
}

// Standalone presence crawler (separate tool): DHT heartbeat topics only, never dials peers.
tasks.register('crawlerJar', Jar) {
    group = 'build'
    description = 'Builds the standalone IceBridge presence crawler fat JAR (multi-arch jlibtorrent natives).'

    archiveFileName = 'icebridge-crawler.jar'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.MF', 'META-INF/*.md')
    exclude('META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties')
    exclude('com/limegroup/gnutella/gui/**')
    exclude('com/frostwire/gui/**')
    exclude('com/frostwire/desktop/**')

    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    from { configurations.icebridgeCloudNatives.collect { it.isDirectory() ? it : zipTree(it) } }

    manifest {
        attributes 'Main-Class': 'com.frostwire.search.relay.crawl.IceBridgeCrawler',
                'Enable-Native-Access': 'ALL-UNNAMED'
    }
}

tasks.register('runCrawler', JavaExec) {
    group = 'application'
    description = 'Runs the headless IceBridge presence crawler. Use -Pcrawler.args="--once --buckets 3" for a single pass.'

    dependsOn crawlerJar

    classpath = files("${layout.buildDirectory.get().asFile}/libs/icebridge-crawler.jar")
    mainClass = 'com.frostwire.search.relay.crawl.IceBridgeCrawler'
    jvmArgs '--enable-native-access=ALL-UNNAMED'

    if (project.hasProperty('crawler.args')) {
        args project.property('crawler.args').toString().split()
    }
}

tasks.register('runMirror', JavaExec) {
    group = 'application'
    description = 'Runs the allowlist-driven IceBridge mirror (re-shares selected torrents). Use -Pmirror.args="--db ... --relay-url ... --mirror-dir ... --allow-file ...".'

    dependsOn crawlerJar

    classpath = files("${layout.buildDirectory.get().asFile}/libs/icebridge-crawler.jar")
    mainClass = 'com.frostwire.search.relay.crawl.IceBridgeMirror'
    jvmArgs '--enable-native-access=ALL-UNNAMED'

    if (project.hasProperty('mirror.args')) {
        args project.property('mirror.args').toString().split()
    }
}

tasks.register('icebridge', JavaExec) {
    group = 'application'
    description = 'Runs the IceBridge relay server. Reads config from .env or ICEBRIDGE_* env vars. Use -Picebridge.args="--generate-token" to create a new bearer token.'

    dependsOn icebridgeJar

    classpath = files("${layout.buildDirectory.get().asFile}/libs/icebridge.jar")
    mainClass = 'com.frostwire.search.relay.icebridge.IceBridgeServer'
    jvmArgs '--enable-native-access=ALL-UNNAMED'

    // Pass through all system properties starting with ICEBRIDGE_
    System.getProperties().stringPropertyNames().each { name ->
        if (name.startsWith('ICEBRIDGE_')) {
            systemProperty name, System.getProperty(name)
        }
    }

    // Pass through ICEBRIDGE_ env vars as system properties
    System.getenv().each { name, value ->
        if (name.startsWith('ICEBRIDGE_')) {
            systemProperty name, value
        }
    }

    if (project.hasProperty('icebridge.args')) {
        args project.property('icebridge.args').toString().split()
    }

    standardInput = System.in
}

tasks.register('runIceBridgeSimulation', JavaExec) {
    group = 'application'
    description = 'Runs the isolated IceBridge workload benchmark, live visualization, and HTML report.'
    dependsOn tasks.named('simulationClasses')
    classpath = sourceSets.simulation.runtimeClasspath
    mainClass = 'com.frostwire.search.relay.icebridge.sim.IceBridgeSimulationMain'

    if (project.hasProperty('simulation.args')) {
        args project.property('simulation.args').toString().split().findAll { it }
    }
}

tasks.register('runIceBridgeLoopback', JavaExec) {
    group = 'application'
    description = 'Runs real signed search/response through bounded loopback IceBridge nodes.'
    dependsOn tasks.named('simulationClasses')
    classpath = sourceSets.simulation.runtimeClasspath
    mainClass = 'com.frostwire.search.relay.icebridge.sim.LoopbackSimulationMain'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_24)) {
        jvmArgs '--illegal-native-access=deny'
    }
    if (project.hasProperty('loopback.nodes')) {
        args '--nodes=' + project.property('loopback.nodes')
    }
}

tasks.register('simulationTest', Test) {
    group = 'verification'
    description = 'Runs only the isolated IceBridge simulation and benchmark tests.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
    jvmArgs '-Djava.awt.headless=true'
    // The SWIG jlibtorrent JNI binding requires explicit permission on JDK 24+.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_24)) {
        jvmArgs '--illegal-native-access=deny'
    }
    filter {
        includeTestsMatching 'com.frostwire.search.relay.icebridge.sim.*'
        includeTestsMatching 'com.frostwire.search.relay.icebridge.IceBridgeNetworkSimulationTest'
        includeTestsMatching 'com.frostwire.search.relay.icebridge.TopologyAutoResearchTest'
        includeTestsMatching 'com.frostwire.search.relay.MultiInstanceDistributedSearchTest.twoInstancesSearchEachOther'
        includeTestsMatching 'com.frostwire.search.relay.MultiRelayMeshSearchTest.searchCrossesThreeForwardersToPeerWithIndex'
    }
    testLogging {
        events 'passed', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.register('verifySimulationIsolation') {
    group = 'verification'
    description = 'Verifies that simulation-only classes are absent from FrostWire client and IceBridge artifacts.'
    dependsOn tasks.named('jar'), tasks.named('icebridgeJar')
    doLast {
        [tasks.named('jar').get().archiveFile.get().asFile,
         tasks.named('icebridgeJar').get().archiveFile.get().asFile].each { artifact ->
            def leaked = zipTree(artifact).matching {
                include 'com/frostwire/search/relay/icebridge/sim/**'
            }.files
            if (!leaked.isEmpty()) {
                throw new org.gradle.api.GradleException(
                        "Simulation classes leaked into ${artifact.name}: ${leaked}")
            }
        }
    }
}

// ---------------------------------------------------------------------------
// Coverage-guided fuzzing with Jazzer (skills/frostwire-fuzz-pipeline).
// Harnesses live in ../common/fuzz/src/test/java, their committed seed and
// crash inputs in ../common/fuzz/src/test/resources/<pkg>/<Class>Inputs/<method>/.
// Neither task is wired into test, check or build, so CI never runs them.
//   ./gradlew fuzzTest
//       replays every committed input as plain JUnit (regression mode, no fuzzing)
//   ./gradlew fuzz -Pfuzz.target=<FQCN> [-Pfuzz.duration=300s] [-Pfuzz.keepGoing=N]
//       fuzzes ONE harness for a fixed time (Jazzer runs one fuzz test per JVM)
// ---------------------------------------------------------------------------
def fuzzBaseDir = file('../common/fuzz')

sourceSets {
    fuzzTest {
        java.srcDir '../common/fuzz/src/test/java'
        resources.srcDir '../common/fuzz/src/test/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    fuzzTestImplementation.extendsFrom implementation
    fuzzTestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    fuzzTestImplementation platform('org.junit:junit-bom:5.13.4')
    fuzzTestImplementation 'org.junit.jupiter:junit-jupiter'
    fuzzTestImplementation 'com.code-intelligence:jazzer-junit:0.30.0'
    fuzzTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def configureFuzzTask = { Test t ->
    t.group = 'verification'
    t.dependsOn tasks.named('fuzzTestClasses')
    t.testClassesDirs = sourceSets.fuzzTest.output.classesDirs
    t.classpath = sourceSets.fuzzTest.runtimeClasspath
    t.useJUnitPlatform()
    t.maxParallelForks = 1
    t.maxHeapSize = '2g'
    // Jazzer writes crash files to <basedir>/src/test/resources/<pkg>/<Class>Inputs/<method>/
    // and the generated corpus to <basedir>/.cifuzz-corpus/<Class>/<method>/.
    t.workingDir = fuzzBaseDir
    t.systemProperty 'jazzer.internal.basedir', fuzzBaseDir.absolutePath
    // One input running longer than this is a hang finding (libFuzzer -timeout).
    t.systemProperty 'junit.jupiter.execution.timeout.testtemplate.method.default', '10s'
    t.systemProperty 'java.awt.headless', 'true'
    t.systemProperty 'java.util.logging.config.file', new File(fuzzBaseDir, 'logging.properties').absolutePath
    // Jazzer self-attaches its agent and loads libFuzzer through JNI.
    t.jvmArgs '-XX:+EnableDynamicAgentLoading', '--enable-native-access=ALL-UNNAMED'
    t.filter {
        includeTestsMatching '*FuzzTest'
    }
    t.testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

tasks.register('fuzzTest', Test) { t ->
    description = 'Replays the committed Jazzer seed and crash inputs as plain JUnit tests (no fuzzing).'
    configureFuzzTask(t)
}

tasks.register('fuzz', Test) { t ->
    description = 'Fuzzes one Jazzer harness: -Pfuzz.target=<FQCN> [-Pfuzz.duration=300s] [-Pfuzz.keepGoing=N].'
    configureFuzzTask(t)
    outputs.upToDateWhen { false }
    // libFuzzer progress, the finding's stack trace and the crash file path go to stdout/stderr.
    testLogging.showStandardStreams = true
    def target = project.findProperty('fuzz.target')
    environment 'JAZZER_FUZZ', '1'
    // Jazzer turns the 10 s default above into libFuzzer's per-input -timeout. JUnit itself must
    // not enforce it, or it fails the whole fuzzing invocation once it has run for 10 s.
    systemProperty 'junit.jupiter.execution.timeout.mode', 'disabled'
    systemProperty 'jazzer.max_duration', project.findProperty('fuzz.duration') ?: '300s'
    if (project.hasProperty('fuzz.keepGoing')) {
        systemProperty 'jazzer.keep_going', project.property('fuzz.keepGoing')
    }
    // Comma-separated DEDUP_TOKENs of known findings, to fuzz past them before they are fixed.
    if (project.hasProperty('fuzz.ignore')) {
        systemProperty 'jazzer.ignore', project.property('fuzz.ignore')
    }
    // Jazzer's bundled ASM may not read the newest JDK's class files yet ("Unsupported class file
    // major version"); the hooks into JDK classes (ReDoS, command injection sanitizers) then stay
    // off. -Pfuzz.javaVersion=24 runs the fuzzer on an older toolchain JDK instead.
    if (project.hasProperty('fuzz.javaVersion')) {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(project.property('fuzz.javaVersion').toString().toInteger())
        }
    }
    if (target) {
        filter.includePatterns.clear()
        filter.includeTestsMatching target.toString()
    }
    long startedAt = 0
    doFirst {
        if (!target) {
            throw new GradleException('Jazzer fuzzes one harness per run: pass -Pfuzz.target=<fully qualified FuzzTest class>')
        }
        startedAt = System.currentTimeMillis()
    }
    // With -Pfuzz.keepGoing the test passes as long as fewer findings than N were made, so
    // fail on any crash file this run wrote instead of trusting the JUnit result.
    doLast {
        // Only this harness's inputs: seeds committed to other harnesses during the run aren't findings.
        def inputs = 'src/test/resources/' + target.toString().replace('.', '/') + 'Inputs/**/'
        def findings = fileTree(fuzzBaseDir) {
            include inputs + 'crash-*', inputs + 'timeout-*', inputs + 'oom-*', inputs + 'slow-unit-*',
                    'crash-*', 'timeout-*', 'oom-*', 'slow-unit-*'
        }.files.findAll { it.lastModified() >= startedAt }
        if (!findings.isEmpty()) {
            throw new GradleException("Fuzzing wrote ${findings.size()} finding(s):\n  " +
                    findings.collect { it.absolutePath }.sort().join('\n  '))
        }
    }
}

// The standalone daemon is part of the desktop runtime, not just a developer convenience.
// Put it beside frostwire.jar in distributions so the installed application can launch it.
distributions {
    main {
        contents {
            from(icebridgeJar) {
                into 'lib'
            }
        }
    }
}

