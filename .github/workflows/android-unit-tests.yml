name: android unit tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Git defaults
        # Silences git's "default branch name" hint on checkout.
        run: git config --global init.defaultBranch master
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default 'packages' still requests the removed 'tools'
          # package, which makes `sdkmanager tools` fail with exit code 1.
          # Install only packages that still exist in the SDK repository.
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Compile Android main + test code
        working-directory: android
        run: ./gradlew compilePlus1DebugJavaWithJavac compilePlus1DebugUnitTestJavaWithJavac --no-daemon

      # An API newer than minSdk 26 passes every desktop test and then crashes older phones
      # (frostwire/frostwire#1400): fail on any lint NewApi issue, in android/ and common/.
      - name: Check for APIs newer than minSdk (lint NewApi)
        working-directory: android
        run: |
          ./gradlew lintPlus1Debug -PlintNewApiOnly --no-daemon
          python3 ../.github/scripts/check_android_newapi.py build/reports/lint-results-plus1Debug.xml

      # The whole unit-test suite, with JaCoCo coverage. build.gradle excludes the few test packages
      # that boot MainApplication under Robolectric and hang.
      - name: Run unit tests with coverage
        working-directory: android
        run: ./gradlew createPlus1DebugUnitTestCoverageReport --no-daemon --continue

      # Coverage may only go up; raise the minimum as tests are added (goal: 100%). Baseline
      # 2026-11-01: 9.1% of lines (the report also counts common/, which the desktop suite tests).
      - name: Coverage summary
        if: always() && hashFiles('android/build/reports/coverage/test/plus1/debug/report.xml') != ''
        run: |
          python3 -I .github/scripts/coverage_summary.py "Android coverage" \
            android/build/reports/coverage/test/plus1/debug/report.xml \
            --fail-under-line 9 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('android/build/reports/coverage/test/plus1/debug/report.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: android-coverage-report
          path: android/build/reports/coverage/test/plus1/debug/
          retention-days: 14

      # Release builds shrink and rename classes with R8, which debug builds and the tests above
      # don't: a missing keep rule (for jlibtorrent, its AAR's consumer rules) only showed up when
      # building a release. Shrinks the release build; nothing is signed.
      - name: Shrink the release build with R8
        working-directory: android
        run: ./gradlew minifyPlus1ReleaseWithR8 --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-results
          path: android/build/reports/tests/testPlus1DebugUnitTest/
          retention-days: 14
