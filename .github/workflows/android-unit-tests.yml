name: android unit tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default 'packages' still requests the removed 'tools'
          # package, which makes `sdkmanager tools` fail with exit code 1.
          # Install only packages that still exist in the SDK repository.
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Compile Android main + test code
        working-directory: android
        run: ./gradlew compilePlus1DebugJavaWithJavac compilePlus1DebugUnitTestJavaWithJavac --no-daemon

      # An API newer than minSdk 26 passes every desktop test and then crashes older phones
      # (frostwire/frostwire#1400): fail on any lint NewApi issue, in android/ and common/.
      - name: Check for APIs newer than minSdk (lint NewApi)
        working-directory: android
        run: |
          ./gradlew lintPlus1Debug -PlintNewApiOnly --no-daemon
          python3 ../.github/scripts/check_android_newapi.py build/reports/lint-results-plus1Debug.xml

      - name: Run non-Robolectric unit tests
        working-directory: android
        run: ./gradlew testPlus1DebugUnitTest --tests "com.frostwire.android.gui.RelaySearchWiringTest" --tests "com.frostwire.android.core.*" --tests "com.frostwire.android.gui.transfers.TorrentUrlInfoTest" --tests "com.frostwire.android.gui.transfers.TorrentUrlInfoCompatibilityTest" --tests "com.andrew.apollo.MusicPlaybackServiceForegroundStartTest" --tests "com.devspark.appmsg.MsgManagerThreadingTest" --tests "com.frostwire.android.gui.util.OffMainQueryTest" --tests "com.frostwire.android.gui.fragments.TransferDetailTrackersAdapterTest" --tests "com.andrew.apollo.ui.activities.BaseActivitySearchableInfoTest" --tests "com.frostwire.android.gui.services.EngineThreadPoolTest" --tests "com.frostwire.android.gui.adapters.menu.CancelMenuActionDialogRestoreTest" --tests "com.frostwire.android.gui.adapters.SearchResultListAdapterFileTypeCallbackTest" --tests "com.frostwire.android.gui.util.DirectionDetectorScrollListenerTest" --tests "com.frostwire.android.gui.transfers.TransferManagerLockScopeStructureTest" --tests "com.frostwire.android.gui.services.EngineStopBeforeForegroundTest" --tests "com.frostwire.android.util.StaleWorkManagerJobsTest" --tests "com.frostwire.android.gui.MainApplicationStructureTest" --tests "com.frostwire.android.util.FWImageLoaderCreationTest" --tests "com.frostwire.android.util.FWImageLoaderBackgroundTest" --tests "com.andrew.apollo.ui.activities.ShortcutActivityLaunchTest" --tests "com.frostwire.android.util.SavedStateSizesTest" --no-daemon --continue

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-unit-test-results
          path: android/build/reports/tests/testPlus1DebugUnitTest/
          retention-days: 14
