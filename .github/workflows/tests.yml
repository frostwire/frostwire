name: desktop tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - util
          - search
          - mp4

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Git defaults
        # Silences git's "default branch name" hint on checkout.
        run: git config --global init.defaultBranch master
      - uses: actions/checkout@v7

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run tests
        run: |
          cd desktop
          if [ "${{ github.event.inputs.test_suite }}" = "all" ] || [ -z "${{ github.event.inputs.test_suite }}" ]; then
            ./gradlew test jacocoTestReport jacocoTestCoverageVerification
          else
            ./gradlew test --tests "com.frostwire.${{ github.event.inputs.test_suite }}.*"
          fi

      - name: Coverage summary
        if: always() && hashFiles('desktop/build/reports/jacoco/test/jacocoTestReport.xml') != ''
        run: |
          python3 -I .github/scripts/coverage_summary.py "Desktop + common coverage" \
            desktop/build/reports/jacoco/test/jacocoTestReport.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('desktop/build/reports/jacoco/test/jacocoTestReport.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: desktop-coverage-report
          path: desktop/build/reports/jacoco/test/html
          retention-days: 14

      # Replays every committed fuzz seed and fixed-crash input as plain JUnit (no fuzzing),
      # so a parser fix can't silently regress (skills/frostwire-fuzz-pipeline). Crash inputs
      # are only committed together with their fix, so this never turns red on a new finding.
      - name: Replay fuzz corpus
        if: github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == ''
        run: |
          cd desktop
          ./gradlew fuzzTest
