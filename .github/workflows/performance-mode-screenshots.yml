# Screenshots for frostwire/frostwire#1555 (Options > Advanced > Performance). Runs only on the
# performance-mode-screenshots branch, which is never merged.
name: Performance mode screenshots

on:
  push:
    branches:
      - performance-mode-screenshots
  workflow_dispatch:

jobs:
  shots:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '27'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    - name: Build classes
      shell: bash
      run: cd desktop && ./gradlew classes
    - name: Take screenshots
      shell: bash
      run: |
        cd desktop
        CP=$(./gradlew -q -I ../tools/performance-mode-screenshots/cp.gradle printRuntimeCp | grep '^CP=' | sed 's/^CP=//')
        mkdir -p ../shots ../demo
        SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
        javac -cp "$CP" -d ../demo ../tools/performance-mode-screenshots/PerformancePaneDemo.java
        for theme in default dark; do for mode in lite full; do
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" java --add-opens=java.desktop/javax.swing=ALL-UNNAMED --add-opens=java.desktop/java.awt=ALL-UNNAMED -cp "../demo${SEP}$CP" PerformancePaneDemo $theme $mode ../shots/$RUNNER_OS-$theme-$mode.png
          else
            java --add-opens=java.desktop/javax.swing=ALL-UNNAMED --add-opens=java.desktop/java.awt=ALL-UNNAMED -cp "../demo${SEP}$CP" PerformancePaneDemo $theme $mode ../shots/$RUNNER_OS-$theme-$mode.png
          fi
        done; done
    - uses: actions/upload-artifact@v7
      with:
        name: shots-${{ matrix.os }}
        path: shots/
